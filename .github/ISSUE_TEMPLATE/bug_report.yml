name: Bug report
description: Report a reproducible bug in the app
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please include exact steps and expected behavior.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps in order.
      placeholder: |
        1. Open ...
        2. Press Option+K ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web UI
        - API / GraphQL
        - Keyboard shortcuts
        - Notifications / Nudge
        - Infra / CI
    validations:
      required: true
